# ======================
# = TMUX CONFIGURATION =
# ======================
# Modern tmux configuration with which-key style menus
# Following XDG Base Directory specification

# ===[ Core Settings ]===
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color*:Tc"
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0

# ===[ Vi Mode ]===
setw -g mode-keys vi
set -g status-keys vi

# ===[ Key Bindings ]===

# Vi-style copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Reload configuration
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Reload configuration
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vi-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
bind v copy-mode

# ===[ Which-Key Style Menus ]===
# Main help menu (replaces default key list)
bind b display-menu -T "TMUX Which-Key" -x C -y C \
	"Panes"                p "display-menu -T 'Panes' -x C -y C \
		'Split Vertical'   '|'   'split-window -h -c \"#{pane_current_path}\"' \
		'Split Horizontal' '-'   'split-window -v -c \"#{pane_current_path}\"' \
		'Navigate Left'    'h'   'select-pane -L' \
		'Navigate Down'    'j'   'select-pane -D' \
		'Navigate Up'      'k'   'select-pane -U' \
		'Navigate Right'   'l'   'select-pane -R' \
		'Resize Left'      'H'   'resize-pane -L 5' \
		'Resize Down'      'J'   'resize-pane -D 5' \
		'Resize Up'        'K'   'resize-pane -U 5' \
		'Resize Right'     'L'   'resize-pane -R 5' \
		'Close Pane'       'x'   'kill-pane' \
		'Zoom Pane'        'z'   'resize-pane -Z'" \
	"Windows"              w "display-menu -T 'Windows' -x C -y C \
		'New Window'       'c'   'new-window -c \"#{pane_current_path}\"' \
		'Next Window'      'n'   'next-window' \
		'Previous Window'  'p'   'previous-window' \
		'Last Window'      'l'   'last-window' \
		'Rename Window'    ','   'command-prompt -I \"#W\" \"rename-window -- %%\"' \
		'Kill Window'      '&'   'kill-window' \
		'Choose Window'    'w'   'choose-window'" \
	"Sessions"             s "display-menu -T 'Sessions' -x C -y C \
		'New Session'      'N'   'command-prompt -p \"New session name:\" \"new-session -s %%\"' \
		'Detach Session'   'd'   'detach-client' \
		'Rename Session'   '$'   'command-prompt -I \"#S\" \"rename-session -- %%\"' \
		'Choose Session'   's'   'choose-session' \
		'Kill Session'     'K'   'confirm-before -p \"Kill session #S? (y/n)\" kill-session'" \
	"Copy Mode"            C "display-menu -T 'Copy Mode' -x C -y C \
		'Enter Copy Mode'  'v'   'copy-mode' \
		'Paste Buffer'     ']'   'paste-buffer' \
		'Show Buffers'     '='   'choose-buffer'" \
	"Config"               c "display-menu -T 'Config' -x C -y C \
		'Reload Config'    'r'   'source-file ~/.config/tmux/tmux.conf \\; display \"Config reloaded!\"' \
		'Show Keys'        '?'   'list-keys'"

# Quick pane menu
bind P display-menu -T "Pane Operations" -x C -y C \
	"Split Vertical"   | "split-window -h -c '#{pane_current_path}'" \
	"Split Horizontal" - "split-window -v -c '#{pane_current_path}'" \
	"" \
	"Navigate Left"    h "select-pane -L" \
	"Navigate Down"    j "select-pane -D" \
	"Navigate Up"      k "select-pane -U" \
	"Navigate Right"   l "select-pane -R" \
	"" \
	"Close Pane"       x "kill-pane" \
	"Zoom Pane"        z "resize-pane -Z"

# ===[ Status Bar ]===
set -g status off
set -g status-position top
set -g status-interval 5

# Status bar styling (match terminal background)
set -g status-style bg=#191919,fg=colour246
set -g status-left-length 32
set -g status-right-length 150

# Left status: session name
set -g status-left '#[fg=colour235,bg=colour109,bold] #S #[fg=colour109,bg=#191919]'

# Right status: time and system info
set -g status-right '#[fg=colour246]%H:%M #[fg=colour109]%d %b'

# Window status format
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=colour235,bg=colour109,bold] #I:#W #[fg=colour109,bg=#191919]'

# Pane border styles and colors
set -g pane-border-lines heavy
set -g pane-border-indicators off
# Force borders to match terminal's actual background (exact hex from iTerm theme)
set -g pane-border-style 'fg=#191919,bg=#191919'
set -g pane-active-border-style 'fg=#191919,bg=#191919'

# Pane border status enabled
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=black bg=cyan],#[fg=colour246]} #P: #{b:pane_current_path} #{?pane_active,●,○} "

# Message styling
set -g message-style bg=colour109,fg=colour235,bold
set -g message-command-style bg=colour238,fg=colour246

# ===[ Activity & Alerts ]===
setw -g monitor-activity on
set -g visual-activity off
set -g bell-action none
setw -g window-status-bell-style fg=colour235,bg=colour88,bold

# ===[ Display Settings ]===
set -g display-time 2000
set -g display-panes-time 2000  # Give time to see and select pane numbers
set -g display-panes-active-colour colour109
set -g display-panes-colour colour240

# Disable pane numbers display completely (optional)
unbind q
